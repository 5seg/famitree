<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="foliage" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Ground Hill -->
  <ellipse cx="256" cy="460" rx="200" ry="40" fill="#a7f3d0" />
  
  <!-- Trunk -->
  <path d="M 232 440 C 236 360, 230 300, 240 250 C 246 220, 250 200, 256 180 C 262 200, 266 220, 272 250 C 282 300, 276 360, 280 440 Z" fill="url(#trunk)" />
  <path d="M 220 440 Q 180 445 150 455 M 292 440 Q 332 445 362 455" stroke="#78350f" stroke-width="10" stroke-linecap="round" fill="none" />
  
  <!-- Canopy Leaves Clusters -->
  <circle cx="180" cy="200" r="75" fill="url(#foliage)" />
  <circle cx="332" cy="200" r="75" fill="url(#foliage)" />
  <circle cx="256" cy="150" r="85" fill="url(#foliage)" />
  <circle cx="210" cy="240" r="70" fill="url(#foliage)" />
  <circle cx="302" cy="240" r="70" fill="url(#foliage)" />
  <circle cx="256" cy="210" r="80" fill="url(#foliage)" />

  <!-- Sparkling / Ambient Fruits -->
  <circle cx="200" cy="170" r="9" fill="#f43f5e" />
  <circle cx="310" cy="180" r="9" fill="#f43f5e" />
  <circle cx="250" cy="125" r="10" fill="#fbbf24" />
  <circle cx="270" cy="235" r="8" fill="#f43f5e" />

  <!-- Water Drop Symbol at Bottom Right Badge -->
  <g transform="translate(340, 340)">
    <circle cx="48" cy="48" r="48" fill="#10b981" />
    <path d="M 48 20 C 48 20, 28 44, 28 58 C 28 69, 37 78, 48 78 C 59 78, 68 69, 68 58 C 68 44, 48 20, 48 20 Z" fill="#ffffff" />
  </g>
</svg>
